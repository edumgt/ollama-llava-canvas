services:
  # ── MariaDB ──────────────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: canvasdb
      MYSQL_USER: canvasuser
      MYSQL_PASSWORD: canvaspass
    ports:
      - "0.0.0.0:3000:3000"
    command: --max-allowed-packet=64M
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    network_mode: "service:db"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      db:
        condition: service_healthy

  # ── App (Python FastAPI) ─────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    network_mode: "service:db"
    environment:
      PORT: "3000"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: canvasuser
      DB_PASSWORD: canvaspass
      DB_NAME: canvasdb
      JWT_SECRET: "${JWT_SECRET:-change-this-secret-in-production-use-a-long-random-string}"
      OLLAMA_URL: "http://127.0.0.1:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-moondream}"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  db_data:
  ollama_data:
